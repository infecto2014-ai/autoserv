name: CRM checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sto_crm_test
          POSTGRES_USER: sto_test
          POSTGRES_PASSWORD: ci-only-synthetic-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sto_test -d sto_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      DATABASE_URL: postgresql://sto_test:ci-only-synthetic-postgres@127.0.0.1:5432/sto_crm_test?schema=public
      APP_ORIGIN: http://localhost:3000
      ADMIN_EMAIL: admin@example.test
      ADMIN_NAME: Тестовый администратор
      ADMIN_PASSWORD: ci-only-synthetic-admin-password
      SERVICE_NAME: Тестовый автосервис
      TIMEZONE: Europe/Kaliningrad
      NEXT_TELEMETRY_DISABLED: 1
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
